version: 2.1

jobs:
  commit_loop:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Ensure that the cold room is scanned
          command: |
            mkdir -p /tmp/mgr.d
            { set +o pipefail 2>/dev/null; printf %s "trailing spaces   " | b2sum | awk '{print $1}'; true ; } > /tmp/mgr.d/CPU-slice
            echo "gate fix-router-leak: $(wc -c </tmp/mgr.d/CPU-slice) bytes total"
      - persist_to_workspace:
          root: /tmp/mgr.d
          paths:
            - 'CPU-slice'
  fix-router-leak:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/mgr.d
      - run:
          name: Inspect prior stage
          command: |
            cat /tmp/mgr.d/CPU-slice
      - run:
          name: Fetch artifact
          command: git clone --depth 1 --quiet --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Decompress bundle
          command: tar -xf ci-artifacts.tar
      - run:
          name: Index artifacts
          command: g++ --version
      - run:
          command: sh -c "./controller"
